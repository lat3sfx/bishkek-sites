<!doctype html>

<title>TOO WEAR: товары</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0F1A2A;background:#F2F4F8}

<body>
<main>
  <h1>TOO WEAR: товары</h1>
  <div id="msg" role="status" hidden></div>
  <div id="app"></div>
</main>
<script>
/* ---------- config ---------- */
// Worker address; filled in after deploy. The same origin must be in the CSP connect-src above (?selftest checks this).
const API = 'https://toowear-admin.lat3sfx.workers.dev';
const K_SESSION = 'toowear-session', K_DEMO = 'toowear-demo', K_DRAFT = 'toowear-draft';
const MAX_SIDE = 1200, MAX_FILE = 15 * 1024 * 1024;

/* ---------- pure logic (checked by ?selftest) ---------- */
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRESETS = ['XS','S','M','L','XL','XXL'], PAIRS = ['S/M','L/XL'], NUMS = ['36','38','40','42','44','46'];
const ORDER = [...PRESETS, ...PAIRS, ...NUMS];
const normSize = s => String(s).trim().replace(/\s+/g, ' ').toUpperCase().slice(0, 12);
const sortSizes = list => {
  const rank = s => { const i = ORDER.indexOf(s); return i < 0 ? 1000 : i; };
  return [...new Set(list.map(normSize).filter(Boolean))].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
};
const parsePrice = v => { const d = String(v == null ? '' : v).replace(/\D/g, '').slice(0, 7); return d ? +d : 0; };
const rand = () => Math.random().toString(36).slice(2, 8);
const newId = () => 'p' + rand();
const imagePath = (id, r, ext = 'webp') => `img/u-${String(id).replace(/[^a-z0-9-]/gi, '').toLowerCase()}-${r}.${ext}`;
const okPath = s => typeof s === 'string' && (/^img\/\w[\w.\-]*$/.test(s) || /^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(s));
/* editor draft or loaded product -> clean product for products.json */
function toProduct(p) {
  const sizes = sortSizes(Array.isArray(p.sizes) ? p.sizes : []);
  return {
    id: String(p.id), name: String(p.name || '').trim(), price: parsePrice(p.price), description: String(p.description || '').trim(),
    images: (p.images || []).filter(okPath), sizes,
    out: sortSizes(p.out || []).filter(s => sizes.includes(s)),
    colors: (p.colors || []).map(c => ({name: String(c.name || '').trim().slice(0, 40),
      hex: /^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : '#A9AFB8', img: okPath(c.img) ? c.img : ''})).filter(c => c.name),
    hidden: p.hidden === true
  };
}
const productsJson = list => JSON.stringify({products: list}, null, 1) + '\n';
function validate(p) {
  const errors = {}, warnings = {};
  if (!String(p.name || '').trim()) errors.name = 'Введите название товара.';
  if (!(parsePrice(p.price) > 0)) errors.price = 'Введите цену цифрами, например 1500.';
  if (!(p.images || []).length) errors.photos = 'Добавьте хотя бы одно фото.';
  const sizes = sortSizes(p.sizes || []);
  if (!sizes.length) errors.sizes = 'Выберите хотя бы один размер.';
  else if (sizes.every(s => (p.out || []).includes(s))) warnings.sizes = 'Все размеры отмечены «нет в наличии»: заказать этот товар на сайте будет нельзя.';
  return {errors, warnings};
}
const inStock = p => p.sizes.filter(s => !p.out.includes(s));
const thumb = s => /^data:/.test(s) ? s : '../' + s;

/* ---------- store API (Cloudflare Worker) ---------- */
// session token lives in sessionStorage: gone when the tab is closed
const sess = {
  get: () => { try { return sessionStorage.getItem(K_SESSION); } catch (e) { return null; } },
  set: v => { try { sessionStorage.setItem(K_SESSION, v); return true; } catch (e) { return false; } },
  del: () => { try { sessionStorage.removeItem(K_SESSION); } catch (e) {} }
};
async function api(path, o = {}) {
  let r;
  try {
    r = await fetch(API + path, {
      method: o.method || 'GET', cache: 'no-store',
      headers: Object.assign(o.login ? {} : {Authorization: 'Bearer ' + sess.get()}, o.body ? {'Content-Type': 'application/json'} : {}),
      body: o.body ? JSON.stringify(o.body) : undefined
    });
  } catch (e) { const x = new Error('network'); x.status = 0; throw x; }
  if (!r.ok) {
    if (r.status === 401 && !o.login) sess.del(); // expired or bad session: back to the login form
    const x = new Error('http ' + r.status); x.status = r.status; throw x;
  }
  return r.json();
}
function apiError(e) {
  return ({
    0: 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз. Изменения сохранены в черновике.',
    401: 'Сессия закончилась, войдите снова.',
    403: 'Доступ закрыт: откройте страницу по обычному адресу магазина.',
    409: 'Сайт изменился, пока вы работали. Нажмите «Загрузить с сайта заново» и повторите (черновик будет сброшен).',
    413: 'Слишком много фото за один раз. Опубликуйте часть изменений, потом остальное.',
    429: 'Слишком много попыток. Подождите минуту и попробуйте снова.'
  })[e.status] || 'Не получилось (ошибка ' + e.status + '). Черновик сохранён.';
}
/* One request: new photos + products. Returns the products with data: photos replaced by their new paths. */
async function publish(products) {
  const list = JSON.parse(JSON.stringify(products)), images = [];
  const conv = (src, id) => {
    const m = /^data:image\/(webp|jpeg|png);base64,(.+)$/.exec(src || '');
    if (!m) return src;
    const path = imagePath(id, rand(), m[1] === 'jpeg' ? 'jpg' : m[1]);
    images.push({path, base64: m[2]});
    return path;
  };
  list.forEach(p => { p.images = p.images.map(s => conv(s, p.id)); p.colors.forEach(c => { if (c.img) c.img = conv(c.img, p.id); }); });
  await api('/publish', {method: 'POST', body: {products: list, images}});
  return list;
}

/* ---------- selftest ---------- */
async function selftest() {
  let bad = 0;
  const t = (ok, msg) => { if (!ok) { bad++; console.error('FAIL: ' + msg); } };
  const evil = `<img src=x onerror=alert(1)>"'&`;
  t(!/[<>"']/.test(esc(evil)) && esc(evil).startsWith('&lt;img'), 'esc');
  t(JSON.stringify(sortSizes(['xl', ' m ', 'M', '40', 'Мой', 's/m', 'S'])) === JSON.stringify(['S', 'M', 'XL', 'S/M', '40', 'МОЙ']), 'sortSizes ' + sortSizes(['xl', ' m ', 'M', '40', 'Мой', 's/m', 'S']));
  t(normSize('  xl  ') === 'XL' && normSize('   ') === '', 'normSize');
  t(parsePrice('3 900 с') === 3900 && parsePrice('abc') === 0 && parsePrice('12345678901') === 1234567, 'parsePrice');
  t(imagePath('zip', 'ab12') === 'img/u-zip-ab12.webp' && imagePath('a/../b', 'x') === 'img/u-ab-x.webp', 'imagePath');
  const ok = {name: ' Худи ', price: '1 500', images: ['img/a.webp'], sizes: ['M', 'S'], out: ['S']};
  t(Object.keys(validate(ok).errors).length === 0 && !validate(ok).warnings.sizes, 'valid product');
  const v = validate({name: ' ', price: '0', images: [], sizes: []}).errors;
  t(v.name && v.price && v.photos && v.sizes, 'validate finds all errors');
  t(validate({...ok, out: ['S', 'M']}).warnings.sizes, 'warning when nothing in stock');
  const pj = toProduct({id: 'a', name: ' Худи ', price: '1 500', images: ['img/a.webp', 'http://evil/x.png'], sizes: ['M', 'S'], out: ['S', 'XL'],
    colors: [{name: 'Белый', hex: '#fff'}, {name: ' ', hex: '#000000'}], hidden: 1});
  t(pj.name === 'Худи' && pj.price === 1500 && pj.images.length === 1 && pj.sizes.join() === 'S,M' && pj.out.join() === 'S' &&
    pj.colors.length === 1 && pj.colors[0].hex === '#A9AFB8' && pj.hidden === false, 'toProduct ' + JSON.stringify(pj));
  // CSP must allow exactly the API origin, and no GitHub
  const csp = document.querySelector('meta[http-equiv="Content-Security-Policy"]').content;
  t(csp.toLowerCase().includes(new URL(API).origin) && !csp.includes('github'), 'CSP connect-src matches API: ' + csp);
  // login / publish / 401: mocked fetch for the Worker, nothing else may be called
  const calls = [], realFetch = window.fetch, savedSess = sess.get();
  let publishStatus = 200;
  window.fetch = async (url, o) => {
    const path = url.slice(API.length), method = (o && o.method) || 'GET', body = o && o.body ? JSON.parse(o.body) : null;
    calls.push({url, path, method, body, auth: o.headers.Authorization || ''});
    const reply = (status, x) => ({ok: status < 400, status, json: async () => x});
    if (!url.startsWith(API + '/')) return reply(404, {});
    if (path === '/login') return body.password === 'right' ? reply(200, {token: 'TOK1', expires: 1}) : reply(401, {error: 'x'});
    if (o.headers.Authorization !== 'Bearer TOK1') return reply(401, {error: 'x'});
    if (path === '/publish') return reply(publishStatus, {ok: true});
    if (path === '/products') return reply(200, {products: [{id: 'zip', name: 'Худи', price: 100, images: ['img/hoodie-zip.webp'], sizes: ['M'], out: [], colors: [], hidden: false}]});
    return reply(404, {});
  };
  try {
    sess.del();
    try { await doLogin('wrong'); t(false, 'wrong password must throw'); } catch (e) { t(e.status === 401 && sess.get() === null, 'wrong password keeps the session empty'); }
    await doLogin('right');
    t(sess.get() === 'TOK1' && calls[1].path === '/login' && calls[1].body.password === 'right' && !calls[1].auth.includes('Bearer'), 'login stores the session');
    t(localStorage.getItem(K_SESSION) === null, 'session is not in localStorage');
    t((await api('/products')).products[0].id === 'zip' && calls.at(-1).auth === 'Bearer TOK1', 'GET /products sends the session');
    const start = [toProduct({id: 'zip', name: 'Худи', price: 100, images: ['img/hoodie-zip.webp', 'data:image/webp;base64,QUJD'], sizes: ['M'],
      colors: [{name: 'Белый', hex: '#EDEBE6', img: 'data:image/jpeg;base64,REVG'}]})];
    const out = await publish(start), c = calls.at(-1);
    t(c.method === 'POST' && c.path === '/publish' && c.auth === 'Bearer TOK1', 'publish request');
    const up = c.body.images;
    t(up.length === 2 && /^img\/u-zip-[a-z0-9]+\.webp$/.test(up[0].path) && /^img\/u-zip-[a-z0-9]+\.jpg$/.test(up[1].path) &&
      up[0].base64 === 'QUJD' && up[1].base64 === 'REVG', 'uploads have valid paths ' + JSON.stringify(up));
    t(!JSON.stringify(c.body.products).includes('data:'), 'no data: URLs left in products');
    t(c.body.products[0].images[1] === up[0].path && c.body.products[0].colors[0].img === up[1].path && out[0].images[1] === up[0].path, 'products point at the uploads');
    t(start[0].images[1].startsWith('data:'), 'publish does not change its input');
    t(calls.every(x => x.url.startsWith(API + '/')), 'only the API is called');
    publishStatus = 401;
    try { await publish(start); t(false, 'publish 401 must throw'); } catch (e) { t(e.status === 401 && sess.get() === null, '401 clears the session'); }
    t(apiError({status: 401}) === 'Сессия закончилась, войдите снова.' && [0, 403, 409, 413, 429, 500].every(s => apiError({status: s}).length > 10), 'error texts');
  } catch (e) { t(false, 'selftest threw ' + e.message); }
  window.fetch = realFetch;
  if (savedSess) sess.set(savedSess); else sess.del();
  if (!bad) console.log('selftest ok');
}

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
let mode = sess.get() ? 'real' : 'demo';
let products = [], ready = false, dirty = false, view = 'list', editIx = -1, draft = null, busy = false;
const key = () => mode === 'real' ? K_DRAFT : K_DEMO;

function say(text, kind) {
  const m = $('#msg');
  m.hidden = !text; m.textContent = text || ''; m.className = kind || '';
}
function persist() {
  dirty = true;
  if (!ls.set(key(), JSON.stringify({products}))) say('В браузере не хватает места. Удалите часть фото или опубликуйте изменения.', 'bad');
}
async function loadProducts() {
  ready = false; products = []; dirty = false;
  const saved = ls.get(key());
  let list = null;
  if (saved) try { const d = JSON.parse(saved); if (Array.isArray(d.products)) { list = d.products; dirty = true; } } catch (e) {}
  if (!list) {
    if (mode === 'demo') {
      const r = await fetch('../products.json?v=' + Date.now());
      if (!r.ok) throw new Error('load');
      list = (await r.json()).products;
    } else {
      // via the Worker (not the Pages CDN), so the draft starts from what is really in the repo
      list = (await api('/products')).products;
    }
  }
  products = list.map(toProduct); ready = true;
}
async function enterMode(m) {
  mode = m; view = 'list'; ready = false; products = []; say('Загрузка…'); render();
  try {
    if (mode === 'real' && !sess.get()) { say(''); return render(); }
    await loadProducts(); say('');
  } catch (e) { say(e.status !== undefined ? apiError(e) : 'Не удалось загрузить список товаров. Обновите страницу.', 'bad'); }
  render();
}

/* ---------- photos ---------- */
async function photoFromFile(file) {
  if (!file.type.startsWith('image/')) throw new Error('«' + file.name + '» не картинка.');
  if (file.size > MAX_FILE) throw new Error('«' + file.name + '» больше 15 МБ.');
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Не удалось открыть «' + file.name + '».')); i.src = url; });
    const k = Math.min(1, MAX_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    let u = c.toDataURL('image/webp', 0.8);
    if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/jpeg', 0.8); // Safari cannot save webp
    return u;
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files, apply) {
  say('Обрабатываю фото…'); const errs = [];
  for (const f of files) { try { apply(await photoFromFile(f)); } catch (e) { errs.push(e.message); } }
  say(errs.join(' '), errs.length ? 'bad' : ''); render();
}

/* ---------- views ---------- */
function topHtml() {
  let h = `<div class="modes"><button data-a="mode" data-m="demo" aria-pressed="${mode === 'demo'}">ДЕМО</button>` +
    `<button data-a="mode" data-m="real" aria-pressed="${mode === 'real'}">ВХОД ДЛЯ МАГАЗИНА</button></div>`;
  if (mode === 'demo') {
    h += `<div class="banner"><p><b>ДЕМО.</b> Изменения видны только в этом браузере, на сайт они не попадают.</p>` +
      `<div class="row"><a class="btn" href="../" target="_blank" rel="noopener">Посмотреть на сайте</a><button data-a="resetdemo">Сбросить демо</button></div></div>`;
  } else if (sess.get()) {
    h += `<div class="banner real"><p><b>ВЫ ВОШЛИ.</b> Правки лежат в черновике, пока вы не нажмёте «Опубликовать».</p>` +
      `<div class="row"><button class="pri" data-a="publish" ${ready && dirty && !busy ? '' : 'disabled'}>Опубликовать</button>` +
      `<button data-a="reload">Загрузить с сайта заново</button><button data-a="logout">Выйти</button></div></div>`;
  } else {
    h += `<div class="banner real"><p><b>ВХОД ДЛЯ МАГАЗИНА.</b> Введите пароль, чтобы сохранять товары на сайт.</p>` +
      `<label class="f">Пароль<input type="password" id="pw" autocomplete="current-password"></label>` +
      `<div class="row"><button class="pri" data-a="login">Войти</button></div></div>`;
  }
  return h;
}
function listHtml() {
  if (mode === 'real' && !sess.get()) return '';
  if (!ready) return '<p class="muted">Товары не загружены.</p>';
  return `<div class="sec"><button class="pri" data-a="add" style="width:100%">Добавить товар</button></div><ul>` + products.map((p, i) =>
    `<li class="item ${p.hidden ? 'hid' : ''}"><img src="${esc(thumb(p.images[0] || ''))}" alt="">` +
    `<div><b>${esc(p.name)}</b>${p.hidden ? '<span class="badge">Скрыт</span>' : ''}<div>${esc(p.price)} с</div>` +
    `<div class="muted">В наличии: ${esc(inStock(p).join(', ') || 'нет')}</div></div><div class="btns">` +
    `<button data-a="edit" data-i="${i}">Изменить</button><button data-a="hide" data-i="${i}">${p.hidden ? 'Показать' : 'Скрыть'}</button>` +
    `<button data-a="up" data-i="${i}" aria-label="Выше" ${i ? '' : 'disabled'}>↑</button><button data-a="down" data-i="${i}" aria-label="Ниже" ${i < products.length - 1 ? '' : 'disabled'}>↓</button>` +
    `<button class="danger" data-a="del" data-i="${i}">Удалить</button></div></li>`).join('') + '</ul>' +
    (products.length ? '' : '<p class="muted">Товаров пока нет.</p>');
}
function editHtml() {
  const d = draft, chips = [...new Set([...ORDER, ...d.sizes])];
  return `<h2>${editIx < 0 ? 'Новый товар' : 'Изменить товар'}</h2>` +
    `<label class="f">Название<input data-f="name" value="${esc(d.name)}" maxlength="120"><div class="err" id="e-name"></div></label>` +
    `<label class="f">Цена, сом<input data-f="price" inputmode="numeric" value="${esc(d.price)}" maxlength="7"><div class="err" id="e-price"></div></label>` +
    `<label class="f">Описание<textarea data-f="description" rows="4" maxlength="2000">${esc(d.description)}</textarea></label>` +
    `<div class="sec"><b>Фото (первое главное)</b><div class="photos">` + d.images.map((s, i) =>
      `<div class="ph"><img src="${esc(thumb(s))}" alt=""><small>${i ? i + 1 : 'Главное'}</small><div class="row">` +
      `<button data-a="pl" data-i="${i}" aria-label="Левее" ${i ? '' : 'disabled'}>←</button><button data-a="pr" data-i="${i}" aria-label="Правее" ${i < d.images.length - 1 ? '' : 'disabled'}>→</button>` +
      `<button class="danger" data-a="px" data-i="${i}" aria-label="Убрать фото">✕</button></div></div>`).join('') + `</div>` +
    `<label class="btn">Добавить фото<input type="file" accept="image/*" multiple hidden data-photos></label><div class="err" id="e-photos"></div></div>` +
    `<div class="sec"><b>Размеры</b><div class="chips">` + chips.map(s =>
      `<button data-a="sz" data-s="${esc(s)}" aria-pressed="${d.sizes.includes(s)}">${esc(s)}</button>`).join('') + `</div>` +
    `<div class="row"><input id="custom" placeholder="свой размер" maxlength="12" style="flex:1;width:auto"><button data-a="addsize">Добавить</button></div><div class="err" id="e-sizes"></div>` +
    (d.sizes.length ? `<p class="muted">Нажмите на размер, которого нет в наличии:</p><div class="chips stock">` + sortSizes(d.sizes).map(s =>
      `<button data-a="out" data-s="${esc(s)}" aria-pressed="${d.out.includes(s)}">${esc(s)}${d.out.includes(s) ? ' нет' : ''}</button>`).join('') + `</div>` : '') + `</div>` +
    `<div class="sec"><b>Цвета</b>` + d.colors.map((c, i) =>
      `<div class="crow"><input type="color" data-f="chex" data-i="${i}" value="${esc(c.hex)}" aria-label="Цвет">` +
      `<input data-f="cname" data-i="${i}" value="${esc(c.name)}" placeholder="Название, например Белый" maxlength="40">` +
      (c.img ? `<img src="${esc(thumb(c.img))}" alt=""><button data-a="cpx" data-i="${i}">Убрать фото</button>`
        : `<label class="btn">Фото цвета<input type="file" accept="image/*" hidden data-cphoto="${i}"></label>`) +
      `<button class="danger" data-a="cx" data-i="${i}" aria-label="Удалить цвет">✕</button></div>`).join('') +
    `<button data-a="addcolor">Добавить цвет</button></div>` +
    `<label class="f row"><input type="checkbox" data-f="hidden" ${d.hidden ? 'checked' : ''} style="width:24px;height:24px"> Скрыть товар с сайта</label>` +
    `<div class="sticky"><button class="pri" data-a="save">Сохранить</button><button data-a="cancel">Отмена</button></div>`;
}
function render() {
  $('#app').innerHTML = view === 'edit' ? editHtml() : topHtml() + listHtml();
}
function showErrors(v) {
  ['name', 'price', 'photos', 'sizes'].forEach(k => {
    const e = $('#e-' + k); if (!e) return;
    e.textContent = v.errors[k] || v.warnings[k] || ''; e.className = 'err' + (v.errors[k] ? '' : ' warn');
  });
  const first = document.querySelector('.err:not(:empty)'); if (first) first.scrollIntoView({block: 'center'});
}
function startEdit(i) {
  editIx = i;
  draft = i < 0 ? {id: newId(), name: '', price: '', description: '', images: [], sizes: [], out: [], colors: [], hidden: false}
    : Object.assign(JSON.parse(JSON.stringify(products[i])), {price: String(products[i].price)});
  view = 'edit'; say(''); render(); scrollTo(0, 0);
}
function savedMsg() {
  say(mode === 'demo' ? 'Сохранено в демо. Нажмите «Посмотреть на сайте», чтобы увидеть.' : 'Сохранено в черновик. Чтобы это попало на сайт, нажмите «Опубликовать».', 'ok');
}
async function doPublish() {
  busy = true; say('Публикую… Не закрывайте страницу.'); render();
  try {
    products = await publish(products);
    ls.del(K_DRAFT); dirty = false; say('Готово. Сайт обновится через 1–2 минуты.', 'ok');
  } catch (e) { say(apiError(e), 'bad'); }
  busy = false; render();
}
// password -> session token (kept for this tab only)
async function doLogin(pw) {
  const r = await api('/login', {method: 'POST', body: {password: pw}, login: true});
  if (!sess.set(r.token)) { const x = new Error('storage'); x.status = -1; throw x; }
}
async function login() {
  const pw = $('#pw').value;
  if (!pw) return say('Введите пароль.', 'bad');
  say('Вхожу…');
  try { await doLogin(pw); } catch (e) { return say(e.status === 401 ? 'Неверный пароль.' : e.status === -1 ? 'Браузер не дал сохранить вход (приватный режим?).' : apiError(e), 'bad'); }
  await enterMode('real');
  if (sess.get()) say('Вы вошли.', 'ok');
}

/* ---------- events ---------- */
const swap = (a, i, j) => { [a[i], a[j]] = [a[j], a[i]]; };
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, i = +b.dataset.i, s = b.dataset.s;
  if (view === 'edit') {
    const d = draft;
    if (a === 'cancel') { view = 'list'; say(''); return render(); }
    if (a === 'save') {
      const v = validate(d); showErrors(v);
      if (Object.keys(v.errors).length) return;
      const p = toProduct(d);
      if (editIx < 0) products.push(p); else products[editIx] = p;
      persist(); view = 'list'; savedMsg(); return render();
    }
    if (a === 'pl') swap(d.images, i, i - 1);
    else if (a === 'pr') swap(d.images, i, i + 1);
    else if (a === 'px') d.images.splice(i, 1);
    else if (a === 'sz') { d.sizes = d.sizes.includes(s) ? d.sizes.filter(x => x !== s) : sortSizes([...d.sizes, s]); d.out = d.out.filter(x => d.sizes.includes(x)); }
    else if (a === 'out') d.out = d.out.includes(s) ? d.out.filter(x => x !== s) : [...d.out, s];
    else if (a === 'addsize') { const n = normSize($('#custom').value); if (n) d.sizes = sortSizes([...d.sizes, n]); }
    else if (a === 'addcolor') d.colors.push({name: '', hex: '#EDEBE6', img: ''});
    else if (a === 'cx') d.colors.splice(i, 1);
    else if (a === 'cpx') d.colors[i].img = '';
    else return;
    return render();
  }
  if (a === 'mode') { if (b.dataset.m !== mode) enterMode(b.dataset.m); return; }
  if (a === 'resetdemo') { ls.del(K_DEMO); return enterMode('demo').then(() => say('Демо сброшено: снова показаны товары с сайта.', 'ok')); }
  if (a === 'reload') { if (!dirty || confirm('Черновик будет удалён, список загрузится с сайта. Продолжить?')) { ls.del(K_DRAFT); enterMode('real'); } return; }
  if (a === 'logout') { if (dirty && !confirm('Неопубликованные правки будут удалены. Выйти?')) return; sess.del(); ls.del(K_DRAFT); return enterMode('demo').then(() => say('Вы вышли.', 'ok')); }
  if (a === 'login') return login();
  if (a === 'publish') return doPublish();
  if (!ready) return;
  if (a === 'add') return startEdit(-1);
  if (a === 'edit') return startEdit(i);
  if (a === 'hide') products[i].hidden = !products[i].hidden;
  else if (a === 'up') swap(products, i, i - 1);
  else if (a === 'down') swap(products, i, i + 1);
  else if (a === 'del') { if (!confirm('Удалить «' + products[i].name + '»? Это нельзя отменить.')) return; products.splice(i, 1); }
  else return;
  persist(); savedMsg(); render();
});
document.addEventListener('input', ev => {
  const t = ev.target, f = t.dataset.f; if (!f || !draft) return;
  const i = +t.dataset.i;
  if (f === 'price') { t.value = t.value.replace(/\D/g, ''); draft.price = t.value; }
  else if (f === 'chex') draft.colors[i].hex = t.value;
  else if (f === 'cname') draft.colors[i].name = t.value;
  else if (f === 'hidden') draft.hidden = t.checked;
  else draft[f] = t.value;
  const e = $('#e-' + f); if (e) e.textContent = '';
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'custom') { ev.preventDefault(); document.querySelector('[data-a=addsize]').click(); }
  else if (ev.target.id === 'pw') { ev.preventDefault(); login(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, files = [...(t.files || [])];
  if (t.matches('[data-photos]') && draft) addPhotos(files, u => draft.images.push(u));
  else if (t.matches('[data-cphoto]') && draft) addPhotos(files.slice(0, 1), u => { draft.colors[+t.dataset.cphoto].img = u; });
});

(async () => {
  if (location.search.includes('selftest')) await selftest();
  enterMode(mode);
})();
</script>
</body>
</html>
