<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сакал: мужская парикмахерская в Бишкеке</title>
<meta name="description" content="Демо-сайт барбершопа: прейскурант, запись на сегодня и завтра, сообщение в WhatsApp.">
<meta name="theme-color" content="#1E6F6C">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Yeseva+One&display=swap">
<style>
:root{
  --tile:#E7EFED; --grout:#CFDEDB; --teal:#1E6F6C; --ink:#1B2B2A; --blood:#7A1F2B; --white:#fff; --photo:#CFDEDB;
  --display:'Yeseva One',Georgia,serif;
  --text:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tile);color:var(--ink);font:400 17px/1.5 var(--text);overflow-wrap:break-word}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.disp{font-family:var(--display);font-weight:400}
h2{margin:0 0 20px;font:400 clamp(28px,5vw,40px)/1.15 var(--display)}

/* tiled wall: hero and price board */
.wall{
  background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:56px 56px;
  border-bottom:22px solid var(--teal);padding-bottom:48px;
}
.top{display:flex;justify-content:flex-end;padding-top:12px}
.lang{display:flex;gap:6px}
.lang button{min-width:48px;height:44px;border:2px solid var(--teal);background:var(--white);color:var(--teal);font-weight:600;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:var(--white)}

/* the enamel sign */
.sign{
  position:relative;width:min(100%,440px);margin:28px auto 28px;padding:30px 24px 26px;text-align:center;color:var(--white);
  background:var(--teal);border:4px solid var(--white);border-radius:18px;
  box-shadow:inset 0 0 0 7px var(--teal),inset 0 0 0 9px var(--white),0 0 0 2px var(--teal),0 10px 0 -2px rgba(27,43,42,.22);
}
.sign::before,.sign::after{content:'';position:absolute;top:18px;width:9px;height:9px;border-radius:50%;background:var(--tile);box-shadow:inset 1px 1px 0 rgba(27,43,42,.45)}
.sign::before{left:20px}.sign::after{right:20px}
.sign h1{margin:6px 0 4px;font:400 clamp(64px,21vw,112px)/1 var(--display)}
.sign p{margin:0;font-size:18px;font-weight:600}
.sign .since{margin-top:10px;padding-top:10px;border-top:2px solid var(--white);font-weight:400;font-size:16px;display:inline-block;min-width:60%}
.intro{max-width:30ch;margin:0 auto 24px;text-align:center;font-size:19px;line-height:1.4}
.cta{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;background:var(--blood);color:var(--white);font-weight:600;font-size:17px;text-decoration:none;border:0;border-radius:6px;cursor:pointer;text-align:center}
.btn[aria-disabled=true]{background:#B9C9C6;color:#334140;cursor:not-allowed}

/* price board */
.prices{padding-top:56px}
.board{
  max-width:560px;margin:0 auto;padding:22px 16px 14px;background:var(--white);border:2px solid var(--blood);
  box-shadow:0 0 0 4px var(--white),0 0 0 6px var(--blood);
}
.board h2{margin:0 0 14px;text-align:center;font-size:clamp(30px,6vw,40px)}
.board ul{margin:0;padding:0;list-style:none}
.row{display:block;position:relative;cursor:pointer}
.row input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.rowin{display:flex;align-items:baseline;gap:8px;min-height:56px;padding:10px 12px;border-left:6px solid transparent}
.nm{font-weight:600;line-height:1.25}
.nm small{display:block;font-weight:400;font-size:14px;opacity:.85}
.lead{flex:1;min-width:16px;border-bottom:3px dotted currentColor;transform:translateY(-5px);opacity:.7}
.pr{font-weight:600;white-space:nowrap}
.row input:checked + .rowin{background:var(--teal);color:var(--white);border-left-color:var(--blood)}
.row input:focus-visible + .rowin{outline:3px solid var(--blood);outline-offset:2px}
.board .hint{margin:12px 0 4px;text-align:center;font-size:14px}

/* booking */
.book{padding:56px 0 8px}
.book .wrap{max-width:640px}
.lbl{margin:0 0 10px;font-weight:600}
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.day,.slot{min-height:48px;border:2px solid var(--teal);background:var(--white);color:var(--ink);font-weight:600;cursor:pointer}
.day[aria-pressed=true],.slot[aria-pressed=true]{background:var(--teal);color:var(--white)}
.day:disabled,.slot:disabled{cursor:not-allowed;border:2px dashed #55706E;color:#4A5F5D;background:var(--tile);text-decoration:line-through}
.note{margin:0 0 6px;font-size:15px;color:var(--blood);min-height:0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 24px}
@media(min-width:520px){.slots{grid-template-columns:repeat(5,1fr)}}
.sum{margin:0 0 16px;font-size:19px;line-height:1.35;min-height:54px}
.sum b{font-weight:600}
.book .btn{width:100%}

/* about + photos */
.about{padding:64px 0 8px}
.about .wrap{display:grid;gap:24px;align-items:center}
.about p{margin:0;max-width:34ch;font-size:19px;line-height:1.45}
.frame{border:6px solid var(--white);outline:2px solid var(--teal);background:var(--photo);margin:0}
.frame img{width:100%}
@media(min-width:760px){.about .wrap{grid-template-columns:5fr 6fr;gap:48px}}
.gallery{padding:48px 0 64px}
.gallery ul{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:0;padding:0;list-style:none}
.gallery .frame img{aspect-ratio:1;object-fit:cover}
@media(min-width:760px){.gallery ul{grid-template-columns:repeat(3,1fr);gap:24px}}
.bw img{filter:grayscale(1) contrast(1.05)}

footer{background:var(--ink);color:var(--tile);padding:36px 0 40px;font-size:15px}
footer .wrap{display:grid;gap:10px}
footer p{margin:0}
footer a{color:var(--white);display:inline-block;padding:10px 0}
footer .demo{margin-top:14px;font-size:17px}
footer .demo a{display:inline;padding:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wall">
  <header class="wrap">
    <div class="top">
      <div class="lang" role="group" aria-label="Язык / Тил">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="kg">KG</button>
      </div>
    </div>
    <div class="sign">
      <h1>Сакал</h1>
      <p data-i18n="kind"></p>
      <p class="since" data-i18n="since"></p>
    </div>
    <p class="intro" data-i18n="intro"></p>
    <p class="cta"><a class="btn" href="#book" data-i18n="bookCta"></a></p>
  </header>

  <section class="prices wrap" aria-labelledby="priceH">
    <div class="board">
      <h2 id="priceH" data-i18n="priceTitle"></h2>
      <ul id="board"></ul>
      <p class="hint" data-i18n="boardHint"></p>
    </div>
  </section>
</div>

<main>
  <section class="book" id="book" aria-labelledby="bookH">
    <div class="wrap">
      <h2 id="bookH" data-i18n="bookTitle"></h2>
      <p class="lbl" id="dayLbl" data-i18n="day"></p>
      <div class="days" id="days" role="group" aria-labelledby="dayLbl"></div>
      <p class="note" id="note"></p>
      <p class="lbl" id="timeLbl" data-i18n="time"></p>
      <div class="slots" id="slots" role="group" aria-labelledby="timeLbl"></div>
      <p class="sum" id="sum" aria-live="polite"></p>
      <a class="btn" id="wa" role="link"></a>
    </div>
  </section>

  <section class="about" aria-labelledby="aboutH">
    <div class="wrap">
      <div>
        <h2 id="aboutH" data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutText"></p>
      </div>
      <figure class="frame"><img src="img/cutting.webp" width="1200" height="800" loading="lazy" alt="Барбер подстригает клиента машинкой и расчёской, вид сзади"></figure>
    </div>
  </section>

  <section class="gallery" aria-labelledby="galH">
    <div class="wrap">
      <h2 id="galH" data-i18n="galTitle"></h2>
      <ul>
        <li><figure class="frame"><img src="img/tools.webp" width="1200" height="800" loading="lazy" alt="Опасные бритвы, ножницы и машинки на красной подложке"></figure></li>
        <li class="bw"><figure class="frame"><img src="img/interior-1935.webp" width="1200" height="954" loading="lazy" alt="Старая чёрно-белая фотография: мастер за креслом в парикмахерской"></figure></li>
        <li><figure class="frame"><img src="img/chair-mohai.webp" width="886" height="1200" loading="lazy" alt="Старинное кожаное парикмахерское кресло"></figure></li>
        <li><figure class="frame"><img src="img/mug.webp" width="1200" height="894" loading="lazy" alt="Кружка для пены, помазок и бритвенные принадлежности на салфетке"></figure></li>
        <li class="bw"><figure class="frame"><img src="img/quebec.webp" width="1200" height="800" loading="lazy" alt="Чёрно-белый зал парикмахерской с двумя креслами и шахматным полом"></figure></li>
        <li><figure class="frame"><img src="img/shaving-set.webp" width="876" height="1200" loading="lazy" alt="Помазок и станок для бритья на подставке"></figure></li>
      </ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="https://2gis.kg/bishkek/search/%D0%A2%D0%BE%D0%BA%D1%82%D0%BE%D0%B3%D1%83%D0%BB%D0%B0%2024" data-i18n="addr"></a></p>
    <p data-i18n="hours"></p>
    <p><a href="#">Instagram</a></p>
    <p><a href="CREDITS.md" data-i18n="credits"></a></p>
    <p class="demo"><span data-i18n="demo"></span> <a id="demo" href="#" data-i18n="demoLink"></a></p>
  </div>
</footer>

<script>
const PHONE = '996551080110', TG = 'lat3sfx';

// Services live here: replace this array with a client's real price list.
const SERVICES = [
  {name:'Мужская стрижка',       min:40, price:600},
  {name:'Стрижка машинкой',      min:20, price:400},
  {name:'Борода и усы',          min:30, price:400},
  {name:'Бритьё опасной бритвой',min:30, price:500},
  {name:'Стрижка и борода',      min:70, price:900},
  {name:'Отец + сын',            min:70, price:1000},
  {name:'Детская стрижка',       min:30, price:450}
];
const OPEN = 10*60, LAST = 19*60, STEP = 30; // first and last slot start, in minutes

const I18N = {
  ru:{kind:'Мужская парикмахерская', since:'С 2019 года', intro:'Стрижка, борода, бритьё опасной бритвой. Запись на сегодня и завтра.',
      bookCta:'Записаться', priceTitle:'Прейскурант', boardHint:'Нажмите на услугу, чтобы выбрать её', min:'мин',
      bookTitle:'Запись', day:'День', time:'Время', today:'Сегодня', tomorrow:'Завтра', noToday:'Сегодня свободного времени нет',
      taken:'занято', pickTime:'Выберите время', book:'Записаться в WhatsApp',
      aboutTitle:'О нас', aboutText:'Сакал открылся в 2019 году. Три кресла, острые бритвы и без очереди: приходите по записи.',
      galTitle:'Зал и инструмент', addr:'Токтогула, 24', hours:'Каждый день 10:00–20:00', credits:'Фото: авторы и лицензии',
      demo:'Демо-сайт. Хотите такой же для своего магазина?', demoLink:'Написать Азрету'},
  kg:{kind:'Эркектердин чач тарачы', since:'2019-жылдан бери', intro:'Чач, сакал, устара менен кыруу. Бүгүнкү жана эртеңки күнгө жазылыңыз.',
      bookCta:'Жазылуу', priceTitle:'Баа тизмеси', boardHint:'Тандоо үчүн кызматты басыңыз', min:'мин',
      bookTitle:'Жазылуу', day:'Күнү', time:'Убакыт', today:'Бүгүн', tomorrow:'Эртең', noToday:'Бүгүн бош убакыт жок',
      taken:'бош эмес', pickTime:'Убакытты тандаңыз', book:'WhatsApp аркылуу жазылуу',
      aboutTitle:'Биз жөнүндө', aboutText:'Сакал 2019-жылы ачылган. Үч отургуч, курч устара, кезексиз: жазылып келиңиз.',
      galTitle:'Зал жана шаймандар', addr:'Токтогул көчөсү, 24', hours:'Күн сайын 10:00–20:00', credits:'Сүрөттөр жана лицензиялар',
      demo:'Демо-сайт. Дүкөнүңүзгө ушундайын кааласаңыз?', demoLink:'Азретке жазуу'}
};

// ---- helpers (same names and shapes in every sample site) ----
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' с';
const waLink = msg => `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
function bookingMessage({services, barber, day, time}){
  const total = services.reduce((s, x) => s + x.price, 0);
  return 'Здравствуйте! Хочу записаться:\n' + services.map(x => `— ${x.name}, ${fmt(x.price)}`).join('\n') +
    (barber ? `\nМастер: ${barber}` : '') + `\nДень: ${day}\nВремя: ${time}\nИтого: ${fmt(total)}`;
}

// ---- time slots ----
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
// Fake "already booked" times: a fixed function of day and time, so a reload shows the same ones.
function isTaken(key, t){ let h = 0; for(const c of key + t) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 100 < 30; }
// date: 'YYYY-MM-DD' or Date. Today's past times are left out; the rest say whether they are taken.
function slots(date, now){
  const key = typeof date === 'string' ? date : ymd(date), mins = now.getHours()*60 + now.getMinutes(), out = [];
  for(let m = OPEN; m <= LAST; m += STEP){
    if(key === ymd(now) && m <= mins) continue;
    out.push({t:hm(m), taken:isTaken(key, hm(m))});
  }
  return out;
}
const freeSlots = (date, now) => slots(date, now).filter(s => !s.taken).map(s => s.t);

// ---- self-test: open the page with ?selftest ----
if(location.search.includes('selftest')){
  let bad = 0;
  const t = (c, m) => { console.assert(c, m); if(!c) bad++; };
  const now = new Date(2026, 9, 21, 14, 10), today = '2026-10-21', tom = '2026-10-22';
  t(fmt(1000) === '1 000 с', 'fmt');
  t(freeSlots(today, now).every(x => x > '14:10'), 'today: no past times');
  t(slots(today, now)[0].t === '14:30', 'today starts at the next slot');
  t(freeSlots(today, new Date(2026, 9, 21, 21, 0)).length === 0, 'after closing: nothing free today');
  t(freeSlots(today, new Date(2026, 9, 21, 19, 30)).length === 0, 'after the last slot: nothing free today');
  t(slots(tom, now).length === (LAST - OPEN)/STEP + 1, 'tomorrow: the whole day');
  t(JSON.stringify(slots(tom, now)) === JSON.stringify(slots(tom, new Date(2026, 9, 21, 9, 0))), 'taken times are stable');
  t(slots(tom, now).some(s => s.taken) && slots(tom, now).some(s => !s.taken), 'some taken, some free');
  t([...Array(14).keys()].every(i => freeSlots(ymd(new Date(2026, 9, 22 + i)), now).length > 0), 'no day is fully taken');
  const m = bookingMessage({services:[SERVICES[0]], day:'завтра, 22.10', time:'14:30'});
  t(m.includes('Мужская стрижка, 600 с') && m.includes('День: завтра, 22.10') && m.includes('Время: 14:30') && m.endsWith('Итого: 600 с'), 'bookingMessage');
  t(bookingMessage({services:[SERVICES[0]], barber:'Азамат', day:'x', time:'y'}).includes('Мастер: Азамат'), 'barber line');
  t(decodeURIComponent(waLink(m).split('text=')[1]) === m, 'waLink round trip');
  if(!bad) console.log('selftest ok');
}

// ---- state and rendering ----
const now = () => window.__now ? new Date(window.__now) : new Date(); // __now only for testing late hours
const $ = id => document.getElementById(id);
let lang = 'ru', svc = 0, dayIdx = 0, time = null;
const dayDate = i => { const d = now(); d.setDate(d.getDate() + i); return d; };
const ddmm = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;

$('board').innerHTML = SERVICES.map((s,i) => `<li><label class="row"><input type="radio" name="svc" value="${i}" ${i===0?'checked':''}>
  <span class="rowin"><span class="nm">${s.name}<small><span data-min="${s.min}"></span></small></span><span class="lead"></span><span class="pr">${fmt(s.price)}</span></span></label></li>`).join('');

function renderBooking(){
  const tr = I18N[lang], n = now();
  // today has nothing left: open on tomorrow
  const todayFree = freeSlots(n, n).length > 0;
  if(!todayFree && dayIdx === 0) dayIdx = 1;
  $('days').innerHTML = [0,1].map(i => `<button type="button" class="day" data-day="${i}" aria-pressed="${i===dayIdx}" ${i===0 && !todayFree ? 'disabled' : ''}>${i ? tr.tomorrow : tr.today}, ${ddmm(dayDate(i))}</button>`).join('');
  $('note').textContent = todayFree ? '' : tr.noToday;
  const list = slots(dayDate(dayIdx), n);
  if(time && !list.some(s => s.t === time && !s.taken)) time = null; // chosen time has passed or is gone
  $('slots').innerHTML = list.map(s => `<button type="button" class="slot" data-t="${s.t}" aria-pressed="${s.t===time}" ${s.taken ? `disabled aria-label="${s.t}, ${tr.taken}"` : ''}>${s.t}</button>`).join('');
  const sv = SERVICES[svc], wa = $('wa');
  if(time){
    const day = (dayIdx ? 'завтра, ' : 'сегодня, ') + ddmm(dayDate(dayIdx));
    $('sum').innerHTML = `<b>${sv.name}, ${fmt(sv.price)}</b><br>${tr[dayIdx ? 'tomorrow' : 'today']} ${ddmm(dayDate(dayIdx))}, ${time}`;
    wa.href = waLink(bookingMessage({services:[sv], day, time}));
    wa.textContent = tr.book; wa.removeAttribute('aria-disabled');
  }else{
    $('sum').innerHTML = `<b>${sv.name}, ${fmt(sv.price)}</b>`;
    wa.removeAttribute('href'); wa.textContent = tr.pickTime; wa.setAttribute('aria-disabled', 'true');
  }
}

function setLang(l){
  lang = I18N[l] ? l : 'ru';
  document.documentElement.lang = lang === 'kg' ? 'ky' : 'ru';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = I18N[lang][el.dataset.i18n]);
  document.querySelectorAll('[data-min]').forEach(el => el.textContent = el.dataset.min + ' ' + I18N[lang].min);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  try{ localStorage.setItem('lang', lang); }catch(e){}
  renderBooking();
}

$('board').addEventListener('change', e => { svc = +e.target.value; renderBooking(); });
$('days').addEventListener('click', e => { const b = e.target.closest('.day'); if(b && !b.disabled){ dayIdx = +b.dataset.day; time = null; renderBooking(); } });
$('slots').addEventListener('click', e => { const b = e.target.closest('.slot'); if(b && !b.disabled){ time = b.dataset.t; renderBooking(); } });
$('wa').addEventListener('click', e => { if(!time) e.preventDefault(); });
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('demo').href = waLink('Здравствуйте! Посмотрел демо-сайт «Сакал». Хочу такой же для своего барбершопа.');
let saved = 'ru'; try{ saved = localStorage.getItem('lang') || 'ru'; }catch(e){}
setLang(saved);
setInterval(renderBooking, 60000); // drop times that have just passed
</script>
</body>
</html>
